<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlie — Preview</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0a0a0a; --dark: #111111; --mid: #1e1e1e; --border: #2a2a2a;
      --muted: #666666; --light: #aaaaaa; --white: #f0ede8; --accent: #c9a84c;
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: 'Helvetica Neue', 'Arial', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background-color: var(--black); color: var(--white); font-family: var(--font-sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 3rem; background: linear-gradient(to bottom, rgba(10,10,10,0.95), transparent); }
    .nav-logo { font-family: var(--font-serif); font-size: 1.3rem; letter-spacing: 0.15em; color: var(--white); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--light); transition: color 0.2s ease; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6rem 2rem 4rem; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(201,168,76,0.06) 0%, transparent 70%); pointer-events: none; }
    .hero-eyebrow { font-size: 0.75rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; }
    .hero-name { font-family: var(--font-serif); font-size: clamp(4rem, 12vw, 10rem); font-weight: normal; letter-spacing: 0.08em; line-height: 1; color: var(--white); margin-bottom: 1.5rem; }
    .hero-tagline { font-size: 0.9rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-bottom: 3rem; }
    .hero-cta { display: inline-block; padding: 0.85rem 2.5rem; border: 1px solid var(--accent); color: var(--accent); font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; transition: background 0.2s ease, color 0.2s ease; }
    .hero-cta:hover { background: var(--accent); color: var(--black); }
    footer { border-top: 1px solid var(--border); padding: 2rem 3rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.05em; }
    .footer-socials { display: flex; gap: 1.5rem; }
    .footer-socials a { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; transition: color 0.2s; }
    .footer-socials a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <nav>
    <a href="#" class="nav-logo">Charlie</a>
    <ul class="nav-links">
      <li><a href="#" class="active">Home</a></li>
      <li><a href="#">Music</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <section class="hero">
    <p class="hero-eyebrow">Singer · Songwriter · Producer</p>
    <h1 class="hero-name">Charlie</h1>
    <p class="hero-tagline">Multi-Instrumentalist · Composer</p>
    <a href="#" class="hero-cta">Listen</a>
  </section>
  <footer>
    <span>© 2026 Charlie</span>
    <div class="footer-socials">
      <a href="#">Instagram</a>
      <a href="#">Spotify</a>
      <a href="#">YouTube</a>
      <a href="#">SoundCloud</a>
    </div>
  </footer>
</body>
</html>
